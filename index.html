<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT LaunchPad - Your Journey to Tech Career</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated Background */
        .tech-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
        }

        .tech-background::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(90deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px),
                linear-gradient(180deg, rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            animation: float 15s infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Navigation */
        .navbar {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }

        /* Main Container */
        .main-container {
            min-height: 100vh;
            padding: 2rem 0;
        }

        /* Section Card */
        .section-card {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 3rem;
            margin: 2rem 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.6s ease;
        }

        .section-card.active {
            transform: translateY(0);
            opacity: 1;
        }

        .section-card:hover {
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 15px 50px rgba(59, 130, 246, 0.3);
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            padding: 1rem 0;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.3);
            }
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        /* Profile Image */
        .profile-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 2rem auto;
        }

        .profile-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        .profile-ring:nth-child(1) {
            border-top-color: #3b82f6;
            border-right-color: #3b82f6;
        }

        .profile-ring:nth-child(2) {
            border-bottom-color: #8b5cf6;
            border-left-color: #8b5cf6;
            animation-direction: reverse;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .profile-img {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }

        .nav-btn:active {
            transform: translateY(-1px);
        }

        /* Progress Bar */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(59, 130, 246, 0.2);
            z-index: 1000;
        }

        .progress-bar-custom {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Section Headers */
        .section-header {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-icon {
            font-size: 2rem;
            color: #3b82f6;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Lists */
        .content-list {
            list-style: none;
            padding: 0;
        }

        .content-list li {
            padding: 1rem;
            margin: 0.5rem 0;
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .content-list li:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateX(10px);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        .info-card {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 15px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-10px);
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .info-card h4 {
            color: #3b82f6;
            margin-bottom: 1rem;
        }

        /* Table Styling */
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }

        .custom-table th {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            padding: 1rem;
            text-align: left;
        }

        .custom-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }

        .custom-table tr:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #3b82f6;
            color: white;
            transform: scale(1.1) rotate(360deg);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
            margin-top: 4rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

            .section-header {
                font-size: 1.8rem;
            }

            .section-card {
                padding: 1.5rem;
            }
        }

        /* Logo Animation */
        .logo-container {
            text-align: center;
            margin: 2rem 0;
        }

        .animated-logo {
            font-size: 4rem;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        .process-step {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            width: 80px;
            border: 2px solid #007bff;
        }

        .step-number {
            background: #007bff;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            line-height: 30px;
            margin: 0 auto 5px;
            font-weight: bold;
        }

        .step-label {
            font-size: 14px;
            font-weight: bold;
            color: #ec4899;
        }

        .process-arrow {
            margin: 0 15px;
            color: #c9e915;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .process-step {
                width: 60px;
                padding: 8px;
            }

            .step-label {
                font-size: 12px;
                color: #ec4899;
            }

            .process-arrow {
                margin: 0 8px;
                font-size: 16px;
            }
        }
    </style>
</head>

<p>After working in the IT industry, I noticed that students often need more practical guidance to feel confident for real-world jobs. IT LaunchPad is created to help students understand how the industry works and prepare step by step.</p>

        function createParticles() {

                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                document.body.appendChild(particle);
            }
        }
        createParticles();

        let currentSection = 0;

        function renderSection(index) {
            const section = sections[index];
            const container = document.getElementById('contentContainer');

            container.innerHTML = `
            <div class="section-card active">
                <h2 class="section-header">
                    <i class="section-icon fas ${section.icon}"></i>
                    ${section.title}
                </h2>
                ${section.content}
                <div class="text-center mt-4">
                    <small class="text-muted">Section ${index + 1} of ${sections.length}</small>
                </div>
            </div>
        `;

            // Update progress bar
            const progress = ((index + 1) / sections.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSection(index) {
            if (index >= 0 && index < sections.length) {
                currentSection = index;
                renderSection(currentSection);
            }
        }

        function nextSection() {
            if (currentSection < sections.length - 1) {
                currentSection++;
                renderSection(currentSection);
            }
        }

        function previousSection() {
            if (currentSection > 0) {
                currentSection--;
                renderSection(currentSection);
            }
        }

        // Load first section on page load
        document.addEventListener("DOMContentLoaded", () => {
            renderSection(0);
        });
    </script>
